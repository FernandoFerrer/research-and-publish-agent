    - data:
        code: "\"\"\"Check extracted source metadata against fetched public source\
          \ text.\"\"\"\nfrom datetime import date, datetime, timedelta\nimport json\n\
          import re\n\ndef _date_in_quote(quote):\n    patterns = ('\\\\b\\\\d{4}-\\\
          \\d{2}-\\\\d{2}\\\\b', '\\\\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\\\
          \\s+\\\\d{1,2},\\\\s+\\\\d{4}\\\\b')\n    found = set()\n    for pattern\
          \ in patterns:\n        for match in re.findall(pattern, quote, flags=re.IGNORECASE):\n\
          \            for fmt in ('%Y-%m-%d', '%B %d, %Y'):\n                try:\n\
          \                    found.add(datetime.strptime(match, fmt).date().isoformat())\n\
          \                    break\n                except ValueError:\n       \
          \             pass\n    if len(found) != 1:\n        raise ValueError('Publication\
          \ quote must contain exactly one recognizable date')\n    return found.pop()\n\
          \ndef validate_metadata(selected, text, proposed, as_of_date, window_days,\
          \ retrieval_date):\n    \"\"\"Reject metadata claims not grounded in exact\
          \ source quotations.\n\n    Dates in unsupported formats cannot establish\
          \ recency. DOI can be omitted\n    if unavailable; if supplied, the DOI\
          \ must occur in the fetched source text.\n    \"\"\"\n    if not all((isinstance(x,\
          \ dict) for x in (selected, proposed))) or not isinstance(text, str) or\
          \ (not text.strip()):\n        raise ValueError('Missing source content\
          \ or metadata')\n    title = proposed.get('source_title')\n    if not isinstance(title,\
          \ str) or not title.strip() or title.strip() not in text:\n        raise\
          \ ValueError('Source title is not present in the fetched text')\n    end\
          \ = date.fromisoformat(as_of_date)\n    if end.isoformat() != as_of_date\
          \ or type(window_days) is not int or (not 1 <= window_days <= 31):\n   \
          \     raise ValueError('Invalid research date or window')\n    retrieved\
          \ = date.fromisoformat(retrieval_date)\n    if retrieved.isoformat() !=\
          \ retrieval_date or retrieved < end:\n        raise ValueError('Invalid\
          \ retrieval date')\n    published, quote = (proposed.get('publication_date'),\
          \ proposed.get('publication_quote'))\n    if published is None:\n      \
          \  if selected.get('role') in ('main', 'highlight'):\n            raise\
          \ ValueError('Recent story has no verifiable publication date')\n    else:\n\
          \        if not isinstance(quote, str) or not quote.strip() or quote not\
          \ in text or (_date_in_quote(quote) != published):\n            raise ValueError('Publication\
          \ date is not supported by the source quote')\n        parsed = date.fromisoformat(published)\n\
          \        if selected.get('role') in ('main', 'highlight') and (not end -\
          \ timedelta(days=window_days - 1) <= parsed <= end):\n            raise\
          \ ValueError('Story publication is outside the research window')\n    doi\
          \ = proposed.get('doi')\n    if doi is not None and (not isinstance(doi,\
          \ str) or not doi.strip() or doi.casefold() not in text.casefold()):\n \
          \       raise ValueError('DOI is not present in the fetched text')\n   \
          \ return {'source_title': title.strip(), 'source_url': selected.get('source_url'),\
          \ 'publication_date': published, 'retrieval_date': retrieval_date, 'topic':\
          \ selected.get('topic'), 'doi': doi, 'text': text}\n\ndef check_source(selected,\
          \ text, proposed_json, as_of_date, window_days, retrieval_date):\n    try:\n\
          \        source = validate_metadata(selected, text, json.loads(proposed_json),\
          \ as_of_date, window_days, retrieval_date)\n    except (TypeError, ValueError)\
          \ as exc:\n        return {'status': 'rejected', 'source_url': selected.get('source_url'),\
          \ 'reason': str(exc)}\n    return {'status': 'accepted', **source}\n\ndef\
          \ main(selected, text, proposed_json, as_of_date, window_days, retrieval_date):\n\
          \    if type(window_days) is float and window_days.is_integer():\n     \
          \   window_days = int(window_days)\n    return {\"source\": check_source(selected,\
          \ text, proposed_json, as_of_date, window_days, retrieval_date)}\n"
