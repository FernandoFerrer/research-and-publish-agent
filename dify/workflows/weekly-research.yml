    - data:
        code: "\"\"\"Validate the research window and construct fixed-topic search\
          \ queries.\"\"\"\nfrom datetime import date, timedelta\nTOPIC_TERMS = {'AI':\
          \ 'artificial intelligence research development', 'science': 'scientific\
          \ research discovery', 'healthcare': 'healthcare clinical research', 'astronomy':\
          \ 'astronomy astrophysics discovery', 'technology': 'technology research\
          \ innovation'}\n\ndef build_search_queries(as_of_date, window_days):\n \
          \   if not isinstance(as_of_date, str):\n        raise ValueError('Expected\
          \ an ISO research date')\n    try:\n        end = date.fromisoformat(as_of_date)\n\
          \    except ValueError as exc:\n        raise ValueError('Invalid research\
          \ date') from exc\n    if end.isoformat() != as_of_date or type(window_days)\
