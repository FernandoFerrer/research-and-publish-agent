    - data:
        code: "import base64\nimport binascii\nimport re\nfrom html.parser import HTMLParser\nfrom urllib.parse import urlsplit\n\nclass Check(HTMLParser):\n    def __init__(self, allowed):\n        super().__init__(convert_charrefs=True)\n        self.allowed = allowed\n        self.tags = set()\n        self.title_text = ''\n        self.in_title = False\n        self.viewport = False\n        self.errors = []\n\n    def handle_decl(self, decl):\n        if decl.lower() == 'doctype html':\n            self.tags.add('doctype')\n\n    def handle_starttag(self, tag, attrs):\n        self.tags.add(tag)\n        attrs = dict(attrs)\n        if tag == 'title':\n            self.in_title = True\n        if tag == 'meta' and attrs.get('name', '').lower() == 'viewport':\n            self.viewport = True\n        if tag in ('script', 'iframe', 'object', 'embed', 'base', 'form', 'link'):\n            self.errors.append('Unsupported external or active content: ' + tag)\n        if any(k.startswith('on')\
          \ or k in ('srcset', 'action') or (k == 'src' and tag != 'img') for k in attrs):\n            self.errors.append('External resources and event handlers are not supported')\n        if tag == 'img':\n            src = attrs.get('src') or ''\n            try:\n                header, encoded = src.split(',', 1)\n                signatures = {'data:image/png;base64': b'\\x89PNG\\r\\n\\x1a\\n', 'data:image/jpeg;base64': b'\\xff\\xd8\\xff', 'data:image/gif;base64': b'GIF8', 'data:image/webp;base64': b'RIFF'}\n                raw = base64.b64decode(encoded, validate=True)\n                signature = signatures.get(header.lower())\n                if not signature or not raw.startswith(signature) or (header.lower() == 'data:image/webp;base64' and raw[8:12] != b'WEBP'):\n                    raise ValueError('Invalid embedded image')\n            except (ValueError, binascii.Error):\n                self.errors.append('Image must contain valid embedded PNG, JPEG, GIF or WebP data')\n \
          \           if not (attrs.get('alt') or '').strip():\n                self.errors.append('Image must have descriptive alt text')\n        if tag == 'a':\n            href = attrs.get('href', '')\n            if href.startswith('#'):\n                return\n            if href not in self.allowed:\n                self.errors.append('Link is not a supplied search result: ' + href)\n\n    def handle_endtag(self, tag):\n        if tag == 'title':\n            self.in_title = False\n\n    def handle_data(self, data):\n        if self.in_title:\n            self.title_text += data\n\ndef main(html, ai, science, healthcare, astronomy, technology, images, testing_mode=False):\n    if not isinstance(html, str):\n        raise ValueError('The content agent did not return HTML')\n    html = html.strip()\n    while html.lower().startswith('<think>'):\n        end = html.lower().find('</think>')\n        if end < 0:\n            raise ValueError('Website response contains incomplete reasoning')\n\
          \        html = html[end + len('</think>'):].strip()\n    if html.startswith('```'):\n        lines = html.splitlines()\n        if lines[-1].strip() == '```':\n            html = '\\n'.join(lines[1:-1]).strip()\n    if not html.lower().startswith('<!doctype html>') or not html.lower().endswith('</html>'):\n        raise ValueError('Website response must contain only a complete HTML document')\n    images = images or []\n    if not isinstance(images, list) or len(images) > 3:\n        raise ValueError('Invalid generated image files')\n    for i, image in enumerate(images, 1):\n        marker = 'cid:illustration-' + str(i)\n        if not isinstance(image, str) or html.count(marker) != 1:\n            raise ValueError('Generated images and website image placeholders do not match')\n        html = html.replace(marker, image)\n    if 'cid:illustration-' in html:\n        raise ValueError('Website contains an image without a generated file')\n    results = [ai, science, healthcare,\
          \ astronomy, technology]\n    if not all(isinstance(group, list) for group in results):\n        raise ValueError('Invalid search results')\n    allowed = set()\n    for group in results:\n        for item in group:\n            if not isinstance(item, dict) or not isinstance(item.get('href'), str):\n                continue\n            url = item['href']\n            try:\n                parsed = urlsplit(url)\n                if parsed.scheme in ('http', 'https') and parsed.hostname and not parsed.username and not parsed.password:\n                    allowed.add(url)\n            except ValueError:\n                continue\n    if testing_mode:\n        html = re.sub(r\"<body(?:\\s[^>]*)?>\", lambda match: match.group(0) + '<p style=\"padding:12px;background:#ffe48a;color:#111;font-weight:bold\">TEST MODE — placeholder content; not for publication</p>', html, count=1, flags=re.IGNORECASE)\n        if 'TEST MODE — placeholder content; not for publication' not in html:\n  \
          \          raise ValueError('Test website must have a body tag for the test notice')\n    check = Check(allowed)\n    check.feed(html)\n    check.close()\n    if not {'doctype', 'html', 'head', 'title', 'body', 'main', 'h1'}.issubset(check.tags) or not check.title_text.strip() or not check.viewport:\n        raise ValueError('Website is missing required HTML structure, title, heading, main content or viewport')\n    if check.errors:\n        raise ValueError('; '.join(check.errors[:3]))\n    return {'index_html': html, 'publication': html}\n"
