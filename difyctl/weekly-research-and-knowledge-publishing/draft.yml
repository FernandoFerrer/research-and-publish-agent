          \ flags=re.IGNORECASE)\n        if 'TEST MODE — placeholder content; not\
          \ for publication' not in html:\n            raise ValueError('Test website\
          \ must have a body tag for the test notice')\n    check = Check(allowed)\n\
          \    check.feed(html)\n    check.close()\n    if not {'doctype', 'html',\
          \ 'head', 'title', 'body', 'main', 'h1'}.issubset(check.tags) or not check.title_text.strip()\
          \ or not check.viewport:\n        raise ValueError('Website is missing required\
