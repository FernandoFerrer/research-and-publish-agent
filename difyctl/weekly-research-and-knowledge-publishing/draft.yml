    - data:
        code: "\"\"\"Validate the research window and construct fixed-topic search queries.\"\"\"\nfrom datetime import date, timedelta\nTOPIC_TERMS = {'AI': 'artificial intelligence research development', 'science': 'scientific research discovery', 'healthcare': 'healthcare clinical research', 'astronomy': 'astronomy astrophysics discovery', 'technology': 'technology research innovation'}\n\ndef build_search_queries(as_of_date, window_days):\n    if not isinstance(as_of_date, str):\n        raise ValueError('Expected an ISO research date')\n    try:\n        end = date.fromisoformat(as_of_date)\n    except ValueError as exc:\n        raise ValueError('Invalid research date') from exc\n    if end.isoformat() != as_of_date or type(window_days) is not int or (not 1 <= window_days <= 31):\n        raise ValueError('Expected YYYY-MM-DD and a window of 1–31 days')\n    start = end - timedelta(days=window_days - 1)\n    return {topic: f'{terms} after:{start.isoformat()} before:{(end + timedelta(days=1)).isoformat()}'\
          \ for topic, terms in TOPIC_TERMS.items()}\n\ndef main(as_of_date, window_days, testing_mode=False):\n    if type(window_days) is float and window_days.is_integer():\n        window_days = int(window_days)\n    queries = build_search_queries(as_of_date, window_days)\n    return {\"test_instructions\": \"TEST MODE: Use minimal output. \" if testing_mode else \"\", \"ai\": queries[\"AI\"], \"science\": queries[\"science\"], \"healthcare\": queries[\"healthcare\"], \"astronomy\": queries[\"astronomy\"], \"technology\": queries[\"technology\"]}\n"
