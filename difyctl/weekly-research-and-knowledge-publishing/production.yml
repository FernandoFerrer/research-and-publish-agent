        code: "import base64\nimport binascii\nimport re\nfrom html.parser import\
          \ HTMLParser\nfrom urllib.parse import urlsplit\n\nclass Check(HTMLParser):\n\
          \    def __init__(self):\n        super().__init__(convert_charrefs=True)\n\
          \        self.tags = set()\n        self.title_text = ''\n        self.in_title\
          \ = False\n        self.viewport = False\n        self.errors = []\n\n \
          \   def handle_decl(self, decl):\n        if decl.lower() == 'doctype html':\n\
          \            self.tags.add('doctype')\n\n    def handle_starttag(self, tag,\
          \ attrs):\n        self.tags.add(tag)\n        attrs = dict(attrs)\n   \
          \     if tag == 'title':\n            self.in_title = True\n        if tag\
          \ == 'meta' and attrs.get('name', '').lower() == 'viewport':\n         \
          \   self.viewport = True\n        if tag in ('script', 'iframe', 'object',\
          \ 'embed', 'base', 'form', 'link'):\n            self.errors.append('Unsupported\
          \ external or active content: ' + tag)\n        if any(k.startswith('on')\
          \ or k in ('srcset', 'action') or (k == 'src' and tag != 'img') for k in\
          \ attrs):\n            self.errors.append('External resources and event\
          \ handlers are not supported')\n        if tag == 'img':\n            src\
          \ = attrs.get('src') or ''\n            try:\n                header, encoded\
          \ = src.split(',', 1)\n                signatures = {'data:image/png;base64':\
          \ b'\\x89PNG\\r\\n\\x1a\\n', 'data:image/jpeg;base64': b'\\xff\\xd8\\xff',\
          \ 'data:image/gif;base64': b'GIF8', 'data:image/webp;base64': b'RIFF'}\n\
          \                raw = base64.b64decode(encoded, validate=True)\n      \
          \          signature = signatures.get(header.lower())\n                if\
          \ not signature or not raw.startswith(signature) or (header.lower() == 'data:image/webp;base64'\
          \ and raw[8:12] != b'WEBP'):\n                    raise ValueError('Invalid\
          \ embedded image')\n            except (ValueError, binascii.Error):\n \
          \               self.errors.append('Image must contain valid embedded PNG,\
          \ JPEG, GIF or WebP data')\n            if not (attrs.get('alt') or '').strip():\n\
          \                self.errors.append('Image must have descriptive alt text')\n\
          \        if tag == 'a':\n            href = attrs.get('href', '')\n    \
          \        if href.startswith('#'):\n                return\n            try:\n\
          \                parsed = urlsplit(href)\n                if parsed.scheme\
          \ not in ('http', 'https') or not parsed.hostname or parsed.username or\
          \ parsed.password or any(c.isspace() for c in href):\n                 \
          \   raise ValueError('Invalid link')\n            except ValueError:\n \
          \               self.errors.append('Link must be a valid HTTP(S) URL: '\
          \ + href)\n\n    def handle_endtag(self, tag):\n        if tag == 'title':\n\
          \            self.in_title = False\n\n    def handle_data(self, data):\n\
          \        if self.in_title:\n            self.title_text += data\n\ndef main(html,\
          \ ai, science, healthcare, astronomy, technology, images, image_files, testing_mode=False):\n\
          \    if not isinstance(html, str):\n        raise ValueError('The content\
          \ agent did not return HTML')\n    html = html.strip()\n    while html.lower().startswith('<think>'):\n\
          \        end = html.lower().find('</think>')\n        if end < 0:\n    \
          \        raise ValueError('Website response contains incomplete reasoning')\n\
          \        html = html[end + len('</think>'):].strip()\n    if html.startswith('```'):\n\
          \        lines = html.splitlines()\n        if lines[-1].strip() == '```':\n\
          \            html = '\\n'.join(lines[1:-1]).strip()\n    if not html.lower().startswith('<!doctype\
          \ html>') or not html.lower().endswith('</html>'):\n        raise ValueError('Website\
          \ response must contain only a complete HTML document')\n    images = images\
          \ or []\n    if not isinstance(images, list):\n        raise ValueError('Invalid\
          \ generated image files')\n    used_images = 0\n    for i, image in enumerate(images,\
          \ 1):\n        marker = 'cid:illustration-' + str(i)\n        if not re.search(re.escape(marker)\
          \ + r'(?![0-9])', html) and isinstance(image_files, list) and i <= len(image_files)\
          \ and isinstance(image_files[i-1], dict):\n            file_id = image_files[i-1].get('related_id')\n\
          \            if file_id:\n                def replace_tool_url(match):\n\
          \                    src = match.group(2)\n                    parsed =\
          \ urlsplit(src)\n                    if parsed.hostname in ('localhost',\
          \ '127.0.0.1') and parsed.path.startswith('/files/tools/' + file_id + '.'):\n\
          \                        return match.group(1) + marker + match.group(3)\n\
          \                    return match.group(0)\n                html = re.sub(r'(<img\\\
          b[^>]*?\\bsrc=[\"\\'])([^\"\\']+)([\"\\'])', replace_tool_url, html, flags=re.IGNORECASE)\n\
          \        matches = list(re.finditer(re.escape(marker) + r'(?![0-9])', html))\n\
