            value: (cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.CV OR cat:q-bio.QM
              OR cat:q-bio.MN OR cat:physics.med-ph OR cat:astro-ph.CO OR cat:astro-ph.HE
              OR cat:astro-ph.EP OR cat:quant-ph OR cat:physics.app-ph OR cat:cs.ET)
              AND {{#queries.arxiv_dates#}}
        type: tool
