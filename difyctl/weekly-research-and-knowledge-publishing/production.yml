        plugin_id: langgenius/arxiv
        plugin_unique_identifier: langgenius/arxiv:0.0.9@fca1da4877575116c3f57006a504d1746248654803617e3f01d0016999fc83bc
        provider_icon: http://127.0.0.1:5001/console/api/workspaces/current/plugin/icon?tenant_id=9c1ca568-a656-475e-8a8c-f410589f62b1&filename=128cb33105e129fee43f313a5f7154df88dd6d8c2e41bcb96571e015df7c8d93.svg
