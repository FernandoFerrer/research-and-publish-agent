    nodes:
    - data:
        code: "\"\"\"Canonical source identity for draft ingestion planning and tests.\"\"\"\nfrom urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit\nTRACKING_KEYS = frozenset({'fbclid', 'gclid', 'mc_cid', 'mc_eid'})\n\ndef canonical_url(url):\n    if not isinstance(url, str):\n        raise ValueError('URL must be a string')\n    parts = urlsplit(url.strip())\n    host = (parts.hostname or '').lower().rstrip('.')\n    if parts.scheme.lower() not in {'http', 'https'} or not host or parts.username or parts.password:\n        raise ValueError('Expected an HTTP(S) URL without credentials')\n    try:\n        port = parts.port\n    except ValueError as exc:\n        raise ValueError('Invalid URL port') from exc\n    scheme = parts.scheme.lower()\n    authority = f'[{host}]' if ':' in host else host\n    if port and (scheme, port) not in {('http', 80), ('https', 443)}:\n        authority += f':{port}'\n    query = [(key, value) for key, value in parse_qsl(parts.query, keep_blank_values=True)\
          \ if not key.lower().startswith('utm_') and key.lower() not in TRACKING_KEYS]\n    return urlunsplit((scheme, authority, parts.path or '/', urlencode(sorted(query), doseq=True), ''))\n\ndef canonical_doi(doi):\n    if not doi:\n        return None\n    if not isinstance(doi, str):\n        raise ValueError('DOI must be a string')\n    value = doi.strip().lower()\n    for prefix in ('https://doi.org/', 'http://doi.org/', 'https://dx.doi.org/', 'doi:'):\n        if value.startswith(prefix):\n            value = value[len(prefix):].strip()\n            break\n    if not value.startswith('10.') or '/' not in value or any((c.isspace() for c in value)):\n        raise ValueError('Invalid DOI')\n    return value\n\ndef is_duplicate(url, doi, existing):\n    \"\"\"Match URL or DOI against all previously indexed sources supplied by caller.\n\n    Caller must fully paginate and serialize ingestion runs. If it cannot do so,\n    it must fail closed; this function does not make concurrent\
          \ creates atomic.\n    \"\"\"\n    normalized_url = canonical_url(url)\n    normalized_doi = canonical_doi(doi)\n    if not isinstance(existing, list):\n        raise ValueError('Existing sources must be a complete list')\n    for source in existing:\n        if not isinstance(source, dict):\n            raise ValueError('Invalid existing source')\n        old_url = source.get('source_url')\n        old_doi = source.get('doi')\n        if not old_url and (not old_doi):\n            raise ValueError('Existing source has no identity; refusing unsafe deduplication')\n        if old_url and canonical_url(old_url) == normalized_url:\n            return True\n        if normalized_doi and old_doi and (canonical_doi(old_doi) == normalized_doi):\n            return True\n    return False\n\n\"\"\"Validate discovery results and prevent a model from inventing source URLs.\"\"\"\nTOPICS = frozenset({'AI', 'science', 'healthcare', 'astronomy', 'technology'})\n\ndef normalize_results(results_by_topic):\n\
          \    if not isinstance(results_by_topic, dict) or set(results_by_topic) != TOPICS:\n        raise ValueError('Search results must cover all five topics')\n    candidates = {}\n    for topic in sorted(TOPICS):\n        results = results_by_topic[topic]\n        if not isinstance(results, list):\n            raise ValueError('Search failed or returned an invalid list')\n        for row in results:\n            if not isinstance(row, dict):\n                continue\n            try:\n                url = canonical_url(row.get('href'))\n            except (ValueError, TypeError):\n                continue\n            title = row.get('title')\n            if not isinstance(title, str) or not title.strip():\n                continue\n            candidate = candidates.setdefault(url, {'source_url': url, 'title': title.strip(), 'topics': [], 'snippet': row.get('body', '')})\n            if topic not in candidate['topics']:\n                candidate['topics'].append(topic)\n    return\
          \ list(candidates.values())\n\ndef select_candidates(candidates, selection, limit=10):\n    if not isinstance(candidates, list) or not isinstance(selection, list):\n        raise ValueError('Invalid research selection')\n    if type(limit) is not int or limit < 1 or limit > 20:\n        raise ValueError('Invalid selection limit')\n    if not selection:\n        return []\n    by_url = {item['source_url']: item for item in candidates}\n    chosen = []\n    seen = set()\n    for item in selection:\n        if not isinstance(item, dict):\n            raise ValueError('Invalid selected item')\n        url = canonical_url(item.get('source_url'))\n        topic = item.get('topic')\n        role = item.get('role')\n        scores = item.get('scores')\n        if role not in {'main', 'support', 'highlight'} or not isinstance(scores, dict):\n            raise ValueError('Missing research role or ranking scores')\n        for field in ('relevance', 'novelty', 'credibility', 'reader_interest'):\n\
          \            score = scores.get(field)\n            if type(score) is not int or not 1 <= score <= 5:\n                raise ValueError('Invalid research score')\n        if url not in by_url or topic not in by_url[url]['topics'] or url in seen:\n            raise ValueError('Selected source not found in topic search results, or repeated')\n        seen.add(url)\n        chosen.append({'source_url': url, 'source_title': by_url[url]['title'], 'topic': topic, 'role': role, 'scores': scores})\n    if len(chosen) > limit:\n        raise ValueError(f'Research selection exceeds the limit of {limit}')\n    if sum((item['role'] == 'main' for item in chosen)) != 1:\n        raise ValueError('Research selection must have exactly one main source')\n    return chosen\n\ndef main(ai, science, healthcare, astronomy, technology):\n    return {\"candidates\": normalize_results({\"AI\": ai, \"science\": science, \"healthcare\": healthcare, \"astronomy\": astronomy, \"technology\": technology})}\n"
