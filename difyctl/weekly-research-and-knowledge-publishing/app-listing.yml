    - id: check_page
      type: custom
      data:
        title: Check document page
        desc: Check pagination and retain source identities.
        version: '1'
        selected: false
        type: code
        code_language: python3
        code: "def main(response, identities, page):\n    if not isinstance(response, list) or len(response) != 1 or not isinstance(response[0], dict):\n        raise ValueError('Document listing failed or returned an invalid response')\n    data = response[0]\n    documents = data.get('data')\n    more = data.get('has_more')\n    if not isinstance(documents, list) or type(more) is not bool or not isinstance(identities, list):\n        raise ValueError('Document listing is incomplete or invalid')\n    if type(page) not in (int, float) or int(page) != page or page < 1:\n        raise ValueError('Invalid document listing page')\n    if more and (not documents or page >= 100):\n        raise ValueError('Document listing exceeded its safety limit or did not advance')\n    for document in documents:\n        if not isinstance(document, dict) or not isinstance(document.get('doc_metadata'), list):\n            raise ValueError('A stored document has no usable source metadata')\n        fields =\
          \ {item.get('name'): item.get('value') for item in document['doc_metadata'] if isinstance(item, dict)}\n        if not fields.get('source_url') and not fields.get('doi'):\n            raise ValueError('A stored document has no source URL or DOI; refusing unsafe deduplication')\n        identities.append({'source_url': fields.get('source_url'), 'doi': fields.get('doi'), 'name': document.get('name')})\n    return {'identities': identities, 'page': int(page) + 1, 'done': 0 if more else 1}\n"
        variables:
        - variable: response
          value_selector:
          - list_documents
          - json
        - variable: identities
          value_selector:
          - list_pages
          - identities
        - variable: page
          value_selector:
          - list_pages
          - page
        outputs:
          identities:
            type: array[object]
            children: null
          page:
            type: number
