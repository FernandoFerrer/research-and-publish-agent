    - data:
        code: "from html.parser import HTMLParser\nfrom urllib.parse import urlsplit\n\nclass Check(HTMLParser):\n    def __init__(self, allowed):\n        super().__init__(convert_charrefs=True)\n        self.allowed = allowed\n        self.tags = set()\n        self.title_text = ''\n        self.in_title = False\n        self.viewport = False\n        self.errors = []\n\n    def handle_decl(self, decl):\n        if decl.lower() == 'doctype html':\n            self.tags.add('doctype')\n\n    def handle_starttag(self, tag, attrs):\n        self.tags.add(tag)\n        attrs = dict(attrs)\n        if tag == 'title':\n            self.in_title = True\n        if tag == 'meta' and attrs.get('name', '').lower() == 'viewport':\n            self.viewport = True\n        if tag in ('script', 'iframe', 'object', 'embed', 'base', 'form', 'link'):\n            self.errors.append('Unsupported external or active content: ' + tag)\n        if any(k.startswith('on') or k in ('src', 'srcset', 'action')\
          \ for k in attrs):\n            self.errors.append('External resources and event handlers are not supported')\n        if tag == 'a':\n            href = attrs.get('href', '')\n            if href.startswith('#'):\n                return\n            if href not in self.allowed:\n                self.errors.append('Link is not a supplied search result: ' + href)\n\n    def handle_endtag(self, tag):\n        if tag == 'title':\n            self.in_title = False\n\n    def handle_data(self, data):\n        if self.in_title:\n            self.title_text += data\n\ndef main(html, ai, science, healthcare, astronomy, technology):\n    if not isinstance(html, str):\n        raise ValueError('The content agent did not return HTML')\n    html = html.strip()\n    if html.startswith('```'):\n        lines = html.splitlines()\n        if lines[-1].strip() == '```':\n            html = '\\n'.join(lines[1:-1]).strip()\n    results = [ai, science, healthcare, astronomy, technology]\n    if not\
          \ all(isinstance(group, list) for group in results):\n        raise ValueError('Invalid search results')\n    allowed = set()\n    for group in results:\n        for item in group:\n            if not isinstance(item, dict) or not isinstance(item.get('href'), str):\n                continue\n            url = item['href']\n            try:\n                parsed = urlsplit(url)\n                if parsed.scheme in ('http', 'https') and parsed.hostname and not parsed.username and not parsed.password:\n                    allowed.add(url)\n            except ValueError:\n                continue\n    check = Check(allowed)\n    check.feed(html)\n    check.close()\n    if not {'doctype', 'html', 'head', 'title', 'body', 'main', 'h1'}.issubset(check.tags) or not check.title_text.strip() or not check.viewport:\n        raise ValueError('Website is missing required HTML structure, title, heading, main content or viewport')\n    if check.errors:\n        raise ValueError('; '.join(check.errors[:3]))\n\
          \    return {'index_html': html, 'publication': html}\n"
        code_language: python3
